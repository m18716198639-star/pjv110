name: orangeFox-PJV110

on:
  workflow_dispatch:

concurrency:
  group: of-pjv110-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OrangeFox vendor_boot (PJV110)
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "== after =="; df -h /

      - name: Add swap (AOSP build needs > 16GB RAM)
        run: |
          set +e
          swapon --show
          # /swapfile may already be active on the runner image ("Text file busy"),
          # so use a separate file.  Never fail the job over swap.
          sudo swapoff /swapfile2 2>/dev/null
          sudo rm -f /swapfile2
          sudo fallocate -l 12G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=12288
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          echo "== memory =="
          free -h
          swapon --show
          exit 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 openjdk-17-jdk-headless \
                                      zip unzip zstd libssl-dev
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "orangefox-ci"
          git config --global user.email "ci@localhost"
          git config --global color.ui false
          repo --version | head -n 2 || true

      - name: Sync OrangeFox sources
        run: |
          set -o pipefail
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/ofsync"
          cd "$HOME/ofsync"
          chmod +x orangefox_sync.sh
          ok=0
          for BR in 16.0 15.0 14.1; do
            echo "== trying OrangeFox branch $BR =="
            if ./orangefox_sync.sh --branch "$BR" --path "$HOME/fox"; then
              if [ -d "$HOME/fox/build" ]; then
                echo "OF_BRANCH=$BR" >> "$GITHUB_ENV"
                ok=1
                break
              fi
            fi
            echo "== branch $BR failed, cleaning up =="
            rm -rf "$HOME/fox"
          done
          if [ "$ok" != "1" ]; then
            echo "!! OrangeFox sync failed for all branches"
            exit 1
          fi
          echo "== freeing .repo =="
          du -sh "$HOME/fox/.repo" 2>/dev/null || true
          rm -rf "$HOME/fox/.repo"
          df -h /

      - name: Copy device tree
        run: |
          mkdir -p "$HOME/fox/device/oplus"
          cp -r device/oplus/PJV110 "$HOME/fox/device/oplus/PJV110"
          DT="$HOME/fox/device/oplus/PJV110"
          echo "== device tree =="
          ls -l "$DT"

          for f in BoardConfig.mk twrp_PJV110.mk device.mk recovery.fstab vendorsetup.sh; do
            if [ ! -f "$DT/$f" ]; then
              echo "!! missing $DT/$f"
              exit 1
            fi
          done

          echo "== AndroidProducts.mk (as uploaded) =="
          head -n 25 "$DT/AndroidProducts.mk"
          if ! grep -q '^PRODUCT_MAKEFILES' "$DT/AndroidProducts.mk"; then
            echo "!! AndroidProducts.mk is broken, rewriting canonical content"
            printf '%s\n' \
              'PRODUCT_MAKEFILES := device/oplus/PJV110/twrp_PJV110.mk' \
              '' \
              'COMMON_LUNCH_CHOICES := twrp_PJV110-eng twrp_PJV110-userdebug' \
              > "$DT/AndroidProducts.mk"
          fi
          echo "== AndroidProducts.mk (used) =="
          cat "$DT/AndroidProducts.mk"

      - name: Build recovery image
        run: |
          set +e
          set -o pipefail
          cd "$HOME/fox"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "== sourcing envsetup =="
          source build/envsetup.sh
          echo "envsetup rc=$?"
          echo "pwd=$(pwd)"
          ls -l build/envsetup.sh 2>/dev/null
          type lunch >/dev/null 2>&1; echo "lunch defined: $?"

          MENU="$GITHUB_WORKSPACE/lunch_menu.txt"

          echo "== device tree =="
          ls -l device/oplus/PJV110

          echo "== release configs dir =="
          ls build/release/release_configs 2>/dev/null | sed 's/\.textproto$//' | head -n 40
          echo "== release config map =="
          sed -n '1,60p' build/release/release_config_map.mk 2>/dev/null

          echo "== lunch menu =="
          lunch > "$MENU" 2>&1
          echo "lunch(menu) rc=$?"
          grep -n "twrp_PJV110" "$MENU" | head -n 20
          tail -n 40 "$MENU"

          # Android 16+ needs <product>-<release>-<variant>.  Collect release
          # names from the lunch menu, the release_configs dir and the release
          # config map, then probe each one.
          RELS="$(grep -oE '\-[A-Za-z0-9_]+-(eng|userdebug)' "$MENU" 2>/dev/null | sed -E 's/^-(.*)-(eng|userdebug)$/\1/' | sort -u | head -n 10)"
          RELS="$RELS $(ls build/release/release_configs 2>/dev/null | sed 's/\.textproto$//' | head -n 10)"
          RELS="$RELS $(grep -hoE '^[A-Za-z0-9_]+[[:space:]]*:=' build/release/release_config_map.mk 2>/dev/null | sed 's/[[:space:]]*:=//' | head -n 10)"
          echo "release candidates: $RELS"

          COMBO="$(grep -oE 'twrp_PJV110-[A-Za-z0-9_]+-(eng|userdebug)' "$MENU" | head -n1)"
          echo "combo from menu: ${COMBO:-<none>}"

          CANDIDATES="$COMBO"
          for REL in $RELS trunk_staging; do
            CANDIDATES="$CANDIDATES twrp_PJV110-${REL}-eng"
          done
          CANDIDATES="$(printf '%s\n' $CANDIDATES | awk 'NF && !seen[$0]++' | head -n 12)"
          echo "candidates:"
          printf '  %s\n' $CANDIDATES

          ok=0
          for C in $CANDIDATES; do
            echo "== lunch $C =="
            lunch "$C"
            rc=$?
            echo "lunch rc=$rc"
            if [ $rc -eq 0 ]; then ok=1; COMBO="$C"; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "!! no working lunch combo for twrp_PJV110"
            exit 1
          fi
          echo "== using combo: $COMBO =="

          echo "== memory =="
          free -h

          echo "== mka recoveryimage (-j3) =="
          mka recoveryimage -j3 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "== first attempt failed ($rc), retrying with -j2 =="
            mka recoveryimage -j2 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
            rc=${PIPESTATUS[0]}
          fi
          echo "build exit code: $rc"
          exit $rc

      - name: Pack vendor_boot image
        run: |
          SRC="$HOME/fox" bash scripts/pack.sh

      - name: Upload vendor_boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-PJV110-vendor_boot
          path: |
            OrangeFox-PJV110-vendor_boot.img
            build.log
            lunch_menu.txt
          if-no-files-found: error

      - name: Upload build log (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          if-no-files-found: ignore
